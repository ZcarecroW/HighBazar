name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # A secret (not a variable) so it is masked in the public build logs.
          HIGHBAZAR_TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "HighBazar ${{ github.ref_name }}"
          # Also the "notes" in latest.json, which the in-app update dialog shows.
          releaseBody: "See https://github.com/ZcarecroW/HighBazar/releases/tag/${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installed apps only accept updates signed with the key behind the pubkey in
      # tauri.conf.json; publishing anything else would break every in-app update.
      - name: Check the updater signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # minisign key id: bytes 2..9 of the second line of the decoded key or signature
          key_id() { base64 -d <<< "$1" | sed -n 2p | base64 -d | head -c 10 | tail -c 8 | od -An -tx1 | tr -d ' \n'; }
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern latest.json
          want=$(key_id "$(jq -r .plugins.updater.pubkey src-tauri/tauri.conf.json)")
          for sig in $(jq -r '.platforms[].signature' latest.json); do
            got=$(key_id "$sig")
            if [ "$got" != "$want" ]; then echo "::error::An update is signed with key $got, but installed apps trust $want."; exit 1; fi
          done
          echo "All $(jq '.platforms | length' latest.json) updater signatures use key $want."

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
