# Builds the documentation (docs/site) and publishes it with GitHub Pages at
# https://zcarecrow.github.io/HighBazar/. The build fails on broken links.
# Locally: node docs/site/build.mjs --serve
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "package.json"
      - "app-icon.svg"
      - "src/icons/nucleo.ts"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling one that
# is half way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci --ignore-scripts

      - run: node docs/site/build.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
