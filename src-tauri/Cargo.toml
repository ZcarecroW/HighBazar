[package]
name = "highbazar"
version = "1.3.0"
description = "HighBazar – an AI companion and moderation bot for Twitch chat"
authors = ["ZcarecroW"]
license = "MIT"
repository = "https://github.com/ZcarecroW/HighBazar"
edition = "2024"
rust-version = "1.90"

[lib]
name = "highbazar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-process = "2.4.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-log = "2.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "fs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "charset", "query", "form", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
keyring = "4.2.0"
thiserror = "2.0.21"
anyhow = "1.0.104"
rand = "0.10.3"
uuid = { version = "1.28.0", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
regex = "1.13.1"
log = "0.4.34"
url = "2.5.8"
parking_lot = "0.12.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
