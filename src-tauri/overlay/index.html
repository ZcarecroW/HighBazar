<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>HighBazar Chat</title>
    <link rel="stylesheet" href="/overlay.css" id="css" />
  </head>
  <body>
    <div id="feed"><div id="chat"></div></div>
    <div id="status" hidden></div>
    <form id="say" hidden autocomplete="off">
      <ul id="sug" role="listbox" hidden></ul>
      <input id="say-in" maxlength="600" spellcheck="true" role="combobox" aria-autocomplete="list" aria-controls="sug" aria-expanded="false" />
      <button id="say-btn" type="submit" aria-label="Send">➤</button>
    </form>
    <script src="/overlay.js" id="js"></script>
  </body>
</html>
